name: Cross-Compile Windows Binary

on:
  schedule:
    - cron: '0 19 * * *'  # Daily at 7 PM UTC
  workflow_dispatch:

jobs:
  build:
    name: Cross-Compile to Windows on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Rust + Windows target
        run: |
          rustup target add x86_64-pc-windows-gnu

      - name: Install MinGW (Windows linker)
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build Windows binary
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: zedwin-windows
          path: target/x86_64-pc-windows-gnu/release/*.exe
